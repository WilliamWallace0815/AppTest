<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USK St. Koloman – Nächste Spiele</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f8;
    color: #1a1a1a;
  }
  header {
    background: #0b3d91;
    color: #fff;
    padding: 1.25rem 1rem;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 1.4rem;
  }
  header p {
    margin: 0.25rem 0 0;
    font-size: 0.9rem;
    opacity: 0.85;
  }
  main {
    max-width: 900px;
    margin: 1.5rem auto;
    padding: 0 1rem;
  }
  .games {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .game-card {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    padding: 1rem 1.25rem;
  }
  .game-card .date {
    font-weight: 700;
    color: #0b3d91;
    font-size: 0.95rem;
  }
  .game-card .teams {
    font-size: 1.1rem;
    margin: 0.35rem 0 0.15rem;
  }
  .game-card .meta {
    font-size: 0.85rem;
    color: #666;
  }
  .status-line {
    font-size: 0.85rem;
    color: #666;
    margin-top: 0.75rem;
  }
  .fallback {
    margin-top: 1rem;
    font-size: 0.95rem;
    background: #fff;
    border-radius: 8px;
    padding: 1rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .fallback a {
    color: #0b3d91;
    font-weight: 600;
    text-decoration: none;
  }
  .fallback a:hover {
    text-decoration: underline;
  }
  footer {
    text-align: center;
    font-size: 0.8rem;
    color: #666;
    padding: 1.5rem 1rem;
  }
</style>
</head>
<body>

<header>
  <h1>USK St. Koloman</h1>
  <p>Spielplan – die nächsten Spiele</p>
</header>

<main>
  <div id="games" class="games">
    <p class="game-card">Lade Spielplan…</p>
  </div>
  <p class="status-line" id="status-line"></p>

  <p class="fallback" id="fallback" hidden>
    Die Spieldaten konnten nicht automatisch geladen werden. Direkt hier nachsehen:<br>
    👉 <a href="https://ticker.ligaportal.at/mannschaft/507/usk-st-koloman/spielplan" target="_blank" rel="noopener">
      Spielplan auf ligaportal.at
    </a><br>
    👉 <a href="https://vereine.oefb.at/UskRaikaStKoloman/Termine/" target="_blank" rel="noopener">
      Termine auf der offiziellen Vereinsseite (oefb.at)
    </a>
  </p>
</main>

<script>
  const WEEKDAYS = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

  function formatDate(isoDate) {
    if (!isoDate) return "Termin folgt";
    const d = new Date(isoDate + "T00:00:00");
    const weekday = WEEKDAYS[d.getDay()];
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    return `${weekday}, ${dd}.${mm}.${d.getFullYear()}`;
  }

  function renderGames(games) {
    const container = document.getElementById("games");
    if (!games.length) {
      container.innerHTML = "";
      document.getElementById("fallback").hidden = false;
      return;
    }
    container.innerHTML = games.map(g => `
      <div class="game-card">
        <div class="date">${formatDate(g.date)}${g.time ? " · " + g.time + " Uhr" : ""}</div>
        <div class="teams">${g.home} – ${g.away}</div>
        <div class="meta">${[g.competition, g.venue].filter(Boolean).join(" · ")}</div>
      </div>
    `).join("");
  }

  fetch("data/spielplan.json", { cache: "no-store" })
    .then(res => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(data => {
      renderGames(data.games || []);
      const statusLine = document.getElementById("status-line");
      if (data.updatedAt) {
        const updated = new Date(data.updatedAt);
        statusLine.textContent = "Zuletzt aktualisiert: " + updated.toLocaleString("de-AT");
      }
      if (data.error) {
        document.getElementById("fallback").hidden = false;
      }
    })
    .catch(err => {
      console.error("Konnte Spielplan-Daten nicht laden:", err);
      document.getElementById("games").innerHTML = "";
      document.getElementById("fallback").hidden = false;
    });
</script>

<footer>
  Daten eingebunden von ligaportal.at &middot; USK Raika St. Koloman
</footer>

</body>
</html>
