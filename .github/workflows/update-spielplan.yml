name: Update USK St. Koloman Spielplan

on:
  schedule:
    - cron: "0 4 * * *"  # täglich um 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape fixtures
        run: python scripts/scrape_spielplan.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/spielplan.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update Spielplan-Daten"
          git push
